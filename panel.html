<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
  <title>Criteria Catcher</title>
</head>
<body>
  <div class="top">
    <header>
      <h1>Criteria Catcher</h1>
      <span id="pageInfo" class="badge">checking…</span>
    </header>

    <div class="tabs" role="tablist">
      <button id="tabCatch" class="tab" type="button" role="tab"
              aria-selected="true" aria-controls="viewCatch">Catch</button>
      <button id="tabInput" class="tab" type="button" role="tab"
              aria-selected="false" aria-controls="viewInput">Input</button>
    </div>
  </div>

  <section id="viewCatch" class="view" role="tabpanel" aria-labelledby="tabCatch">
    <div class="catch-head">
    <div class="modes" role="radiogroup" aria-label="Page type">
      <label><input type="radio" name="mode" value="submission"><span>Submission</span></label>
      <label><input type="radio" name="mode" value="review"><span>Review</span></label>
      <label><input type="radio" name="mode" value="refinement"><span>Refinement</span></label>
    </div>
    <p id="modeHint" class="hint"></p>

    <label class="check">
      <input type="checkbox" id="runChecks" checked>
      Run the feedback checks first
    </label>

    <button id="catch" class="primary">Catch criteria</button>
    </div>

    <section id="skeleton" class="result" hidden aria-hidden="true">
      <div class="part">
        <div class="part-head"><span>UID</span></div>
        <div class="part-body"><span class="sk" style="width: 62%"></span></div>
      </div>
      <div class="part">
        <div class="part-head"><span>Content</span></div>
        <div class="part-body">
          <span class="sk" style="width: 38%"></span>
          <span class="sk" style="width: 92%"></span>
          <span class="sk" style="width: 84%"></span>
          <span class="sk" style="width: 66%"></span>
          <span class="sk sk-gap" style="width: 46%"></span>
          <span class="sk" style="width: 88%"></span>
          <span class="sk" style="width: 79%"></span>
        </div>
      </div>
    </section>

    <section id="result" class="result" hidden>
      <div class="part" id="uidPart" role="button" tabindex="0" title="Click to copy the UID">
        <div class="part-head">
          <span>UID</span>
          <span class="copy-icon" aria-hidden="true">
            <svg class="icon-copy" width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"></path></svg>
            <svg class="icon-check" width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>
          </span>
        </div>
        <div class="part-body mono" id="uidValue"></div>
      </div>

      <div class="part" id="contentPart" role="button" tabindex="0" title="Click to copy the content">
        <div class="part-head">
          <span>Content</span>
          <span class="copy-icon" aria-hidden="true">
            <svg class="icon-copy" width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"></path></svg>
            <svg class="icon-check" width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>
          </span>
        </div>
        <pre class="part-body" id="contentValue"></pre>
      </div>

      <div class="links">
        <button id="copyJson" class="link">Copy JSON</button>
        <button id="download" class="link">Download JSON</button>
        <button id="toInput" class="link">Send criteria to input</button>
      </div>
    </section>
  </section>

  <section id="viewInput" class="view" role="tabpanel" aria-labelledby="tabInput" hidden>
    <textarea id="json" spellcheck="false" placeholder='Paste or upload criteria like this:

"criteria": [
  { "1": "Criterion text, at least 20 characters.", "weight": 2 },
  { "2": "A failure mode carries a negative weight.", "weight": -3 }
]

The outer { } are optional, and so is the last ]. "criterion"
works in place of the number. Order decides which section
each row goes to.'></textarea>

    <div class="links">
      <button id="loadFile" class="link">Open file…</button>
      <button id="format" class="link">Format</button>
      <button id="clear" class="link">Clear</button>
    </div>

    <div class="options">
      <label>
        Entry
        <select id="entry">
          <option value="paste" selected>Paste per field</option>
          <option value="type">Type per key</option>
        </select>
      </label>
      <label>
        Pace
        <select id="speed">
          <option value="6">Fast</option>
          <option value="22" selected>Human</option>
          <option value="55">Careful</option>
        </select>
      </label>
      <label>
        Gap
        <select id="gap" title="Pause after each field is filled">
          <option value="500">0.5s</option>
          <option value="1000">1s</option>
          <option value="2000" selected>2s</option>
          <option value="4000">4s</option>
        </select>
      </label>
    </div>
    <label class="check">
      <input type="checkbox" id="removeExtras" checked>
      Add or delete sections to match the JSON
    </label>

    <button id="apply" class="primary">Type into page</button>
  </section>

  <div class="bottom">
    <p id="status" class="status"></p>
  </div>

  <div id="busy" class="busy" hidden>
    <div class="busy-card">
      <div class="pulse" aria-hidden="true"><span></span><span></span><span></span></div>
      <p id="busyText" class="busy-text">Working…</p>
      <button id="busyStop" class="link">Stop</button>
    </div>
  </div>

  <input type="file" id="file" accept=".json,application/json" hidden>
</body>
<script src="panel.js"></script>
</html>
